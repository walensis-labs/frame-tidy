[project]
name = "aura-mcp"
version = "0.1.2"
description = "MCP server for finding and removing photos of a specific person from Aura frames"
readme = "README.md"
authors = [
    { name = "AJ Wallace", email = "24554274+ajwallacemusic@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastembed>=0.9.1",
    "httpx>=0.28.1",
    "insightface>=2.1",
    "mcp[cli]>=2.3.0",
    "numpy>=2.5.5",
    # The macOS app (Python 3.12) supports macOS 12 on Apple silicon and Intel. These are the
    # newest releases with macOS 12 builds for both (later ones need 13 or 14).
    # Checked 2026-11-20; see packaging/README.md, "Older Macs".
    "onnxruntime>=1.19.2,<1.20 ; sys_platform == 'darwin' and python_version < '3.13'",
    "onnxruntime>=1.32.0 ; sys_platform != 'darwin' or python_version >= '3.13'",
    "opencv-python-headless>=4.10,<4.11 ; sys_platform == 'darwin' and python_version < '3.13'",
    "opencv-python-headless>=4.14,<5 ; sys_platform != 'darwin' or python_version >= '3.13'",
    "python-dotenv>=1.2.4",
    "pywebview>=6.2.1",
    "scipy>=1.13",
    "segno>=1.6.6",
    "starlette>=1.10.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
aura-app = "aura_mcp.app:main"
aura-mcp = "aura_mcp.server:main"
aura-mock = "aura_mcp.mock_aura:main"
aura-review = "aura_mcp.review:main"

[build-system]
requires = ["uv_build>=0.9.6,<0.10.0"]
build-backend = "uv_build"

[tool.uv]
# insightface depends on the full `opencv-python`, which would install a second
# copy of `cv2` on top of the headless build. Drop it: the headless package
# provides the same module.
override-dependencies = ["opencv-python ; sys_platform == 'never'"]
# For the macOS app (see the note on the dependencies): onnx (needed by
# insightface) 1.23 dropped macOS 12, and cryptography (needed by mcp) 49
# dropped Intel Macs.
constraint-dependencies = [
    "onnx<1.23 ; sys_platform == 'darwin' and python_version < '3.13'",
    "cryptography<49 ; sys_platform == 'darwin' and python_version < '3.13'",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[dependency-groups]
build = [
    "pyinstaller>=6.22.3",
]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
]
