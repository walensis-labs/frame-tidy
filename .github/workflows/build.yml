# Builds the desktop app on a version tag (v1.2.3) and attaches it to a release.
#
# STATUS: no job has been run on GitHub yet. The macOS build, signing and
# notarization scripts were run locally (Apple silicon, and Intel through
# Rosetta, 2026-11-20). The Windows job has NOT been tested by anyone, so its
# zip is kept as a build artifact and not attached to releases.
#
# macOS: one Universal dmg (Apple silicon and Intel) for macOS 12.3+, built on
# an Apple-silicon runner, the Intel half through Rosetta (see packaging/README.md).
#
# macOS signing and notarization run when these are set in the repository
# (Settings > Secrets and variables > Actions; see packaging/README.md):
#   secrets  APPLE_CERTIFICATE_P12        base64 of the exported Developer ID .p12
#            APPLE_CERTIFICATE_PASSWORD   the password chosen when exporting it
#            APPLE_ID                     Apple ID email used for notarization
#            APPLE_APP_PASSWORD           app-specific password for that Apple ID
#   variable APPLE_TEAM_ID                10-character team id
#   secret   SPARKLE_PRIVATE_KEY          private update key (generate_keys -x), for the
#                                         appcast that installed copies update from
# A release tag also needs docs/release-notes/<version>.md (the release text and
# what Sparkle shows) and packaging/sparkle_public_key.txt.
# Without them a manual run still builds, unsigned. A tagged release never
# publishes an unsigned dmg: the job fails instead.
name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-14
    env:
      CAN_SIGN: ${{ secrets.APPLE_CERTIFICATE_P12 != '' && secrets.APPLE_ID != '' && secrets.APPLE_APP_PASSWORD != '' && vars.APPLE_TEAM_ID != '' }}
      RELEASE: ${{ startsWith(github.ref, 'refs/tags/') }}
      HAS_UPDATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Version
        run: echo "VERSION=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')" >> "$GITHUB_ENV"
      - name: Refuse to release anything incomplete
        if: env.RELEASE == 'true'
        run: |
          problems=0
          if [ "$CAN_SIGN" != true ]; then echo "The Apple signing secrets are not all set." >&2; problems=1; fi
          if [ "$HAS_UPDATE_KEY" != true ]; then echo "The SPARKLE_PRIVATE_KEY secret is not set." >&2; problems=1; fi
          if [ ! -s packaging/sparkle_public_key.txt ]; then echo "packaging/sparkle_public_key.txt is missing." >&2; problems=1; fi
          if [ ! -s "docs/release-notes/$VERSION.md" ]; then echo "docs/release-notes/$VERSION.md is missing." >&2; problems=1; fi
          if [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then echo "Tag $GITHUB_REF_NAME does not match version $VERSION in pyproject.toml." >&2; problems=1; fi
          if [ "$problems" != 0 ]; then echo "See packaging/README.md (Release)." >&2; exit 1; fi
      - name: Make sure Rosetta is installed (for the Intel half)
        run: softwareupdate --install-rosetta --agree-to-license || true
      - run: packaging/build_mac.sh
      - name: Import the signing certificate
        if: env.CAN_SIGN == 'true'
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: packaging/ci_keychain.sh import
      - name: Sign, notarize and staple
        if: env.CAN_SIGN == 'true'
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: packaging/sign_and_notarize.sh
      - name: Remove the signing keychain
        if: always() && env.CAN_SIGN == 'true'
        run: packaging/ci_keychain.sh delete
      - name: Name the dmg by version
        run: mv "dist/Frame Tidy.dmg" "dist/Frame-Tidy-$VERSION.dmg"
      - name: Sign the update and write the appcast
        if: env.RELEASE == 'true'
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          KEY="$RUNNER_TEMP/update.key"
          umask 077
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$KEY"
          python3 packaging/make_appcast.py "dist/Frame-Tidy-$VERSION.dmg" "$VERSION" \
            "docs/release-notes/$VERSION.md" dist/appcast.xml --key-file "$KEY"
          rm -f "$KEY"
      - uses: actions/upload-artifact@v4
        with:
          name: frame-tidy-macos${{ env.CAN_SIGN != 'true' && '-unsigned' || '' }}
          path: dist/Frame-Tidy-*.dmg
      - if: env.RELEASE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          name: Frame Tidy ${{ env.VERSION }}
          body_path: docs/release-notes/${{ env.VERSION }}.md
          files: |
            dist/Frame-Tidy-*.dmg
            dist/appcast.xml

  windows:
    # UNTESTED. Produces a zipped one-folder app (no installer).
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.12
      - run: uv sync --group build
      - run: uv run --group build pyinstaller --noconfirm --clean --distpath dist --workpath build packaging/frame_tidy.spec
      - run: Compress-Archive -Path "dist/Frame Tidy" -DestinationPath "dist/Frame-Tidy-windows.zip"
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: frame-tidy-windows
          path: dist/Frame-Tidy-windows.zip
      # Not attached to releases until someone has tested it on Windows.
